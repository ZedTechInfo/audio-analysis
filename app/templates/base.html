<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AutoAce · Audio evaluation workspace{% endblock %}</title>
    <meta name="description" content="AutoAce AI Evaluator - Evaluate audio files using AI models.">
    <meta name="keywords" content="AutoAce Assessment, AI Evaluator, Audio Evaluation, Machine Learning, Deep Learning">
    <meta name="author" content="Gary Mhone">
    <link rel="stylesheet" href="/static/app.css?v={{ static_version }}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.17/dist/sweetalert2.all.min.js" defer></script>
    <script src="/static/navigation.js?v={{ static_version }}" defer></script>
    <script src="/static/pagination.js?v={{ static_version }}" defer></script>
    {% block head %}{% endblock %}
</head>
<body data-view="dashboard">
    {% if authenticated|default(false) %}{% include "partials/navbar.html" %}{% endif %}
    <main>
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
